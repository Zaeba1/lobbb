name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
            -not -path './extracted/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP archive not found in repository"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Archive: $ZIP_FILE"
          unzip -oq "$ZIP_FILE" -d extracted

          find extracted -type f | head -n 100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found in ZIP"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Generate Gradle Wrapper if missing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            GRADLE_VERSION="8.9"

            if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
              VERSION="$(grep -oE \
                'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?(-all|-bin)?\.zip' \
                gradle/wrapper/gradle-wrapper.properties \
                | head -n 1 \
                | sed -E 's/gradle-//; s/-(all|bin)\.zip//')" || true

              if [ -n "${VERSION:-}" ]; then
                GRADLE_VERSION="$VERSION"
              fi
            fi

            curl -fL --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o /tmp/gradle.zip

            unzip -oq /tmp/gradle.zip -d /tmp

            /tmp/gradle-${GRADLE_VERSION}/bin/gradle \
              --no-daemon wrapper \
              --gradle-version "$GRADLE_VERSION"
          fi

          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
