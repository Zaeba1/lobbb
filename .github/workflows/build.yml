name: Build LovelyKent APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -not -path "./extracted/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP archive not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          PROJECT_DIR="extracted/LovelyKent"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts not found"
            find extracted -name settings.gradle.kts
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          GRADLE_VERSION=$(grep -oE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?(-all|-bin)?\.zip' \
            gradle/wrapper/gradle-wrapper.properties 2>/dev/null \
            | head -n 1 | sed -E 's/gradle-//; s/-(all|bin)\.zip//')

          if [ -z "$GRADLE_VERSION" ]; then
            GRADLE_VERSION="8.9"
          fi

          echo "Using Gradle $GRADLE_VERSION"

          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
            --gradle-version "$GRADLE_VERSION"

          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LovelyKent-debug-APK
          path: extracted/LovelyKent/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
